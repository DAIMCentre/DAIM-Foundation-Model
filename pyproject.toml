[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daim-foundation-models"
version = "0.2.0"
description = "Transparent from-scratch language-model and forecasting examples for DAIM research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/DAIMCentre/DAIM-Foundation-Model"
Issues = "https://github.com/DAIMCentre/DAIM-Foundation-Model/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
